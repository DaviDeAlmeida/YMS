name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore YMS.slnx

      - run: dotnet build YMS.slnx --configuration Release --no-restore

      # The integration tests start PostgreSQL through Testcontainers; the runner ships with Docker.
      - run: dotnet test YMS.slnx --configuration Release --no-build
