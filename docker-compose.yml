# Local infrastructure for development: `docker compose up -d`.
services:
  postgres:
    image: postgres:18-alpine
    container_name: yms-postgres
    environment:
      POSTGRES_DB: yms
      POSTGRES_USER: yms
      POSTGRES_PASSWORD: yms
    ports:
      # 5433 on the host: a native PostgreSQL install usually holds 5432 on Windows.
      - "5433:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<version>.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yms -d yms"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
